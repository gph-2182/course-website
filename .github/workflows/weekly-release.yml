name: "Weekly Course Release & Deploy"

on:
  schedule:
    # Runs every Sunday at 12:00 UTC (8:00 AM EDT / 7:00 AM EST)
    - cron: "0 12 * * 0"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::r02pro
            any::readxl
            any::gt
            any::DT
            any::broom

      - name: Run automated release manager & render website
        run: |
          # Start from a clean output directory so files whose sources are
          # gated (unreleased slides/exercises) never survive from the
          # docs/ folder committed by local renders.
          rm -rf docs
          quarto render

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
